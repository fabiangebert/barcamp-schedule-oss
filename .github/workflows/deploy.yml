name: Deploy

# Deploys to Scaleway after CI has passed on main.
# The backend container is deployed first and the frontend is published only
# afterwards, so a failed backend never leaves the SPA pointing at an API that
# cannot serve it.
# Organization-specific infrastructure (registry namespace, public URL,
# Scaleway project/org) is provided via repository variables and secrets:
#   vars:  SCW_REGISTRY_NAMESPACE, APP_PUBLIC_URL, S3_BUCKET,
#          SCW_EDGE_SERVICE_ID, SCW_MIGRATE_JOB_ID, SCW_APP_CONTAINER_ID,
#          SCW_ORG_ID, MERCURE_DOMAIN, MERCURE_CORS_ORIGINS,
#          MERCURE_HOST, MERCURE_PORT, MERCURE_IMAGE
#   secrets: SCW_ACCESS_KEY, SCW_SECRET_KEY, SCW_DEFAULT_PROJECT_ID,
#            MERCURE_JWT_SECRET, MERCURE_SSH_KEY

on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read
  actions: read

jobs:
  deploy-backend:
    name: Deploy backend to Scaleway
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Pin to the commit the triggering CI run actually tested. Without an
          # explicit ref, workflow_run checks out the default branch head at
          # event time, which can be ahead of the tested commit and would build
          # the container from different sources than the downloaded artifact.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check required variables
        run: |
          if [ -z "${{ vars.SCW_REGISTRY_NAMESPACE }}" ]; then
            echo "SCW_REGISTRY_NAMESPACE var is not set. Cannot deploy."
            exit 1
          fi

      - name: Setup Scaleway CLI
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83 # v0.0.3
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ vars.SCW_ORG_ID }}
          save-config: true
          export-config: true

      - name: Login to Scaleway Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      # 1. Set up Docker Buildx (required for advanced cache backends like 'gha')
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # 2. Build and Push using native GitHub Actions cache (type=gha)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          tags: |
            rg.fr-par.scw.cloud/${{ vars.SCW_REGISTRY_NAMESPACE }}/app:${{ github.event.workflow_run.head_sha }}
            rg.fr-par.scw.cloud/${{ vars.SCW_REGISTRY_NAMESPACE }}/app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Scaleway Serverless Container
        run: |
          IMAGE_URI="rg.fr-par.scw.cloud/${{ vars.SCW_REGISTRY_NAMESPACE }}/app"

          if [ -n "${{ vars.SCW_MIGRATE_JOB_ID }}" ]; then
            echo "Updating migration job with new image..."
            scw jobs definition update "${{ vars.SCW_MIGRATE_JOB_ID }}" image-uri="$IMAGE_URI:${{ github.event.workflow_run.head_sha }}"

            echo "Running database migrations..."
            scw jobs definition start "${{ vars.SCW_MIGRATE_JOB_ID }}" --wait
            echo "Database migrations completed successfully."
          else
            echo "⚠️ SCW_MIGRATE_JOB_ID var is not set. Skipping migrations."
          fi

          if [ -n "${{ vars.SCW_APP_CONTAINER_ID }}" ]; then
            echo "Updating container configuration with new image (triggers redeploy automatically)..."
            scw container container update "${{ vars.SCW_APP_CONTAINER_ID }}" \
              image="$IMAGE_URI:${{ github.event.workflow_run.head_sha }}"
          else
            echo "❌ SCW_APP_CONTAINER_ID var is not set. Cannot update container."
            exit 1
          fi

      - name: Re-deploy Mercure Hub on Dedicated VM
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          MERCURE_JWT_SECRET: ${{ secrets.MERCURE_JWT_SECRET }}
          MERCURE_DOMAIN: ${{ vars.MERCURE_DOMAIN }}
          MERCURE_CORS_ORIGINS: ${{ vars.MERCURE_CORS_ORIGINS }}
          MERCURE_IMAGE: ${{ vars.MERCURE_IMAGE }}
        with:
          host: ${{ vars.MERCURE_HOST }}
          username: mercure-deployer
          key: ${{ secrets.MERCURE_SSH_KEY }}
          port: ${{ vars.MERCURE_PORT || 22 }}
          envs: MERCURE_JWT_SECRET,MERCURE_DOMAIN,MERCURE_CORS_ORIGINS,MERCURE_IMAGE
          script: |
            sudo /usr/local/bin/redeploy-mercure.sh

  # `needs` makes this job run only when deploy-backend succeeded. A failed or
  # skipped backend leaves the currently published frontend in place, so clients
  # keep talking to the container image that is actually serving traffic.
  deploy-frontend:
    name: Deploy frontend to S3
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download frontend build artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: frontend-dist
          path: frontend/dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Scaleway CLI
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83 # v0.0.3
        with:
          access-key: ${{ secrets.SCW_ACCESS_KEY }}
          secret-key: ${{ secrets.SCW_SECRET_KEY }}
          default-project-id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          default-organization-id: ${{ vars.SCW_ORG_ID }}
          save-config: true
          export-config: true

      - name: Install s3cmd
        run: |
          sudo apt-get update
          sudo apt-get install -y s3cmd

      - name: Deploy static files to Scaleway S3
        run: |
          if [ -z "${{ vars.S3_BUCKET }}" ]; then
            echo "⚠️ S3_BUCKET var is not set. Skipping S3 deployment."
          else
            echo "Syncing frontend files to S3 bucket: ${{ vars.S3_BUCKET }}"
            # Generate the s3cmd configuration profile
            scw object config get type=s3cmd > /home/runner/.s3cfg

            # Guarantee cleanup runs when this script block exits
            trap 'rm -f /home/runner/.s3cfg' EXIT

            # 1. Upload hashed assets with a long-term cache policy (excluding non-hashed entry points)
            # NOTE: We deliberately omit '--delete-removed' so that older hashed assets and chunks
            # from previous deployments remain on S3. This ensures that active/running client instances
            # do not get into trouble or experience loading errors when requesting old chunk files.
            s3cmd --no-mime-magic --guess-mime-type \
              --add-header="Cache-Control: public, max-age=31536000, immutable" \
              --exclude="index.html" \
              --exclude="embed.js" \
              sync frontend/dist/ s3://${{ vars.S3_BUCKET }}/

            # 2. Upload non-hashed entry points separately with short edge caching
            s3cmd --no-mime-magic --guess-mime-type \
              --add-header="Cache-Control: public, max-age=0, s-maxage=300" \
              put frontend/dist/index.html s3://${{ vars.S3_BUCKET }}/index.html

            s3cmd --no-mime-magic --guess-mime-type \
              --add-header="Cache-Control: public, max-age=0, s-maxage=300" \
              put frontend/dist/embed.js s3://${{ vars.S3_BUCKET }}/embed.js
          fi

      - name: Purge Scaleway Edge Services Cache
        run: |
          if [ -z "${{ vars.SCW_EDGE_SERVICE_ID }}" ]; then
            echo "⚠️ SCW_EDGE_SERVICE_ID var is not set. Skipping Edge Services cache purge."
          else
            echo "Purging Scaleway Edge Services cache (ID: ${{ vars.SCW_EDGE_SERVICE_ID }})..."
            scw edge-services purge-request create pipeline-id="${{ vars.SCW_EDGE_SERVICE_ID }}" all=true

            # Wait 10 seconds for the global purge to process
            echo "Waiting 10 seconds for purge propagation..."
            sleep 10

            # Pre-warm the cache so the runner handles the "cold start" instead of a user
            echo "Pre-warming the edge cache..."
            curl -s -o /dev/null -w "Response code: %{http_code}\n" "${{ vars.APP_PUBLIC_URL }}" || true
          fi
